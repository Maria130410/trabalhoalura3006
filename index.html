<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css" />
    <title>Conecta Aí</title>
</head>
<body>
    <header class="cabecalho">
        <h1>Confere Aí</h1>
        <nav>
            <a href="#" class="cabecalho-link">Início</a>
        </nav>
    </header>

    <main>
        <h2>Descubra a verdade passando o mouse</h2>
        
        <section>
            <article class="cartao">
                <div class="cartao-interno">
                    <div class="cartao-frente">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Emperor_Penguin_Manchot_empereur.jpg/800px-Emperor_Penguin_Manchot_empereur.jpg" alt="Pinguim filhote">
                        <p>Pinguins conseguem voar como pássaros!</p>
                    </div>
                    <div class="cartao-verso">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Emperor_Penguin_Manchot_empereur.jpg/800px-Emperor_Penguin_Manchot_empereur.jpg" alt="Pinguim na água">
                        <p>Pinguins não voam, mas são excelentes nadadores.</p>
                    </div>
                </div>
            </article>

            <article class="cartao">
                <div class="cartao-interno">
                    <div class="cartao-frente">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Emperor_Penguin_Manchot_empereur.jpg/800px-Emperor_Penguin_Manchot_empereur.jpg" alt="Pinguim filhote">
                        <p>Pinguins conseguem voar como pássaros!</p>
                    </div>
                    <div class="cartao-verso">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Emperor_Penguin_Manchot_empereur.jpg/800px-Emperor_Penguin_Manchot_empereur.jpg" alt="Pinguim na água">
                        <p>Pinguins não voam, mas são excelentes nadadores.</p>
                    </div>
                </div>
            </article>
        </section>
    </main>

    <footer>
        <p>Projeto feito por Maria</p>
    </footer>
</body>
</html>
